[framework]
id = "cmake"
name = "CMake"
version = "1.0.0"
description = "C++ project with a CMake build system"

[variables]
description = { description = "Project description", required = false }
license = { description = "Project license", default = "MIT", required = false }
cpp_standard = { description = "C++ standard", default = "17", required = false, allowed_values = ["14", "17", "20", "23"] }
include_tests = { description = "Include a doctest test setup", default = true, required = false }
initialize_git = { description = "Initialize a git repository", default = true, required = false }

# Only git init runs on generate. No compile step: scaffolding stays fast and
# works without a C++ toolchain installed (the README documents how to build).
[[post_hooks]]
command = "devora_git_init"
description = "Initialize git repository"
condition = "initialize_git == true"

[[conditional_files]]
path = "tests/test_main.cpp"
condition = "include_tests == true"
description = "doctest test file, included when tests are enabled"

[[conditional_files]]
path = "tests/doctest.h"
condition = "include_tests == true"
description = "Vendored doctest single header, included when tests are enabled"

# Shown as the build steps a user runs after generation.
init_commands = [
    "cmake -B build",
    "cmake --build build",
    "ctest --test-dir build",
]
