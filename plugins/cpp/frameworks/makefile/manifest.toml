[framework]
id = "makefile"
name = "Makefile"
version = "1.0.0"
description = "Simple C++ project with Makefile build system"

[variables]
description = { description = "Project description", required = false }
license = { description = "Project license", default = "MIT", required = false }
cpp_standard = { description = "C++ standard", default = "C++17", required = false, allowed_values = ["C++14", "C++17", "C++20", "C++23"] }
project_type = { description = "Project type", default = "executable", required = false, allowed_values = ["executable", "static-lib", "shared-lib"] }
include_tests = { description = "Include test files", default = true, required = false }
compiler = { description = "C++ compiler", default = "g++", required = false, allowed_values = ["g++", "clang++", "cl.exe"] }
build_type = { description = "Build type", default = "Release", required = false, allowed_values = ["Debug", "Release"] }
initialize_git = { description = "Initialize git repository", default = true, required = false }

[[post_hooks]]
command = "make"
description = "Build the project"

[[post_hooks]]
command = "devora_git_init"
description = "Initialize git repository"
condition = "initialize_git == true"

[[conditional_files]]
path = "tests/test_main.cpp"
condition = "include_tests == true"
description = "Include test file when tests are enabled"

init_commands = [
    "make",
    "{% if project_type == 'executable' %}./{{project_name}}{% endif %}"
]