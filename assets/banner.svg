<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Devora - a universal, modular project scaffolding framework">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C0C0E"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="6%" r="62%">
      <stop offset="0" stop-color="#1B1B22" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#08080A" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace; }
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="1" fill="#1E1E24"/>
  <rect x="0" y="359" width="1280" height="1" fill="#141418"/>

  <text x="640" y="158" text-anchor="middle" class="sans" font-size="92" font-weight="700" letter-spacing="-3" fill="#FAFAFA">Devora</text>

  <text x="640" y="206" text-anchor="middle" class="sans" font-size="21" font-weight="400" letter-spacing="0.4" fill="#86868F">A universal, modular project scaffolding framework</text>

  <g>
    <rect x="452" y="244" width="376" height="46" rx="9" fill="#121214" stroke="#26262C"/>
    <circle cx="476" cy="267" r="3" fill="#3F3F46"/>
    <text x="640" y="273" text-anchor="middle" class="mono" font-size="16.5" fill="#C7C7CE">devora new my-app rust</text>
  </g>
</svg>
