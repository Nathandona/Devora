[package]
name = "devora"
version = "0.1.0"
edition = "2021"
authors = ["Nathan Babcock <nathan.r.babcock@gmail.com>"]
description = "A universal, modular project scaffolding framework"
license = "MIT"
repository = "https://github.com/nathanbabcock/Devora"
keywords = ["cli", "scaffold", "template", "generator"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI Framework
clap = { version = "4.4", features = ["derive", "color"] }

# Template Engine
tera = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
toml = "0.8"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# User Interaction
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"

# File System
walkdir = "2.4"

# Async Runtime
tokio = { version = "1.35", features = ["full"] }

# Git Operations
git2 = "0.18"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
shellexpand = "3.1"

[[bin]]
name = "devora"
path = "src/main.rs"