[package]
name = "devora-cli"
version = "0.1.0"
edition = "2021"
authors = ["Nathan Dona <nathan@devora.dev>"]
description = "A modern developer tool for C++ projects inspired by Vite"
license = "MIT"
repository = "https://github.com/Nathandona/Devora"
homepage = "https://github.com/Nathandona/Devora"
documentation = "https://docs.rs/devora-cli"
keywords = ["cpp", "build", "development", "cli", "meson"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"

[dependencies]
# CLI Framework
clap = { version = "4.4", features = ["derive", "color"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Logging
log = "0.4"
env_logger = "0.10"

# File system operations
tokio = { version = "1.0", features = ["full"] }
notify = "6.0"

# Template engine
tera = "1.19"

# Process management
subprocess = "0.2"

# JSON support
serde_json = "1.0"

# File operations
fs_extra = "1.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Interactive prompts
dialoguer = "0.11"
console = "0.15"

# Path utilities
directories = "5.0"
which = "4.4"

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "devora"
path = "src/main.rs"