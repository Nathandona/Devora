name: Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 3 AM UTC
    - cron: '0 3 * * *'

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cargo audit

    - name: Run cargo-deny
      uses: EmbarkStudios/cargo-deny-action@v1

    - name: Upload audit results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: security-audit-results
        path: |
          Cargo.lock
          advisory-db.rs

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Dependency Review
      uses: actions/dependency-review-action@v3
      with:
        fail-on-severity: moderate

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python' ]
        # CodeQL supports JavaScript, Python, but Rust is not yet supported
        # We'll focus on the supported languages for now
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

  rust-security:
    name: Rust Security Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install security tools
      run: |
        cargo install cargo-audit
        cargo install cargo-deny
        cargo install cargo-outdated
        cargo install cargo-tree

    - name: Check for outdated dependencies
      run: cargo outdated --exit-code 1 || echo "Some dependencies are outdated"

    - name: Analyze dependency tree
      run: cargo tree --duplicates --format "{p}" | sort | uniq -c | sort -nr || true

    - name: Run cargo-deny checks
      run: cargo deny check

    - name: Generate security report
      run: |
        echo "# Security Analysis Report" > security-report.md
        echo "Generated on: $(date)" >> security-report.md
        echo "" >> security-report.md

        echo "## Dependency Audit" >> security-report.md
        echo '```' >> security-report.md
        cargo audit --json 2>/dev/null | jq -r '.vulnerabilities[]? | "\(.package): \(.versions | join(", ")) - \(.advisory.description)"' >> security-report.md || echo "No vulnerabilities found" >> security-report.md
        echo '```' >> security-report.md
        echo "" >> security-report.md

        echo "## License Compliance" >> security-report.md
        echo '```' >> security-report.md
        cargo deny check licenses >> security-report.md || echo "License check completed with warnings" >> security-report.md
        echo '```' >> security-report.md

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: security-report.md

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run TruffleHog OSS
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -f docker/Dockerfile.debian -t devora:security-scan .

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'devora:security-scan'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  fuzz-testing:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[fuzz]')
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@nightly

    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz

    - name: Run fuzz tests
      run: |
        if [ -d "fuzz" ]; then
          cargo fuzz run fuzz_target_1 -- -max_total_time=300 || echo "Fuzz testing completed"
        else
          echo "No fuzz targets found, skipping fuzz testing"
        fi

  security-scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Run OSSF Scorecard
      uses: ossf/scorecard-action@v2.3.1
      with:
        results_file: results.sarif
        results_format: sarif
        repo_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload SARIF file to GitHub
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: results.sarif

  notify-security:
    name: Security Notifications
    runs-on: ubuntu-latest
    needs: [audit, dependency-review, rust-security, secret-scan]
    if: always() && (needs.audit.result == 'failure' || needs.dependency-review.result == 'failure' || needs.rust-security.result == 'failure' || needs.secret-scan.result == 'failure')
    steps:
    - name: Create security issue
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Security scan found issues',
            body: `Security scans detected potential issues in commit ${context.sha}.

          Please review the workflow logs and address the security concerns:

          - Audit: ${{ needs.audit.result }}
          - Dependency Review: ${{ needs.dependency-review.result }}
          - Rust Security: ${{ needs.rust-security.result }}
          - Secret Scan: ${{ needs.secret-scan.result }}

          This issue was automatically created by GitHub Actions.`,
            labels: ['security', 'automated']
          })