name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v2
        with:
          command: release-pr
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: rust
          package-name: devora
          changelog-types: '[{"type":"feat","section":"Features","hidden":false},{"type":"fix","section":"Bug Fixes","hidden":false},{"type":"perf","section":"Performance Improvements","hidden":false},{"type":"refactor","section":"Code Refactoring","hidden":true},{"type":"chore","section":"Chores","hidden":true},{"type":"docs","section":"Documentation","hidden":false},{"type":"style","section":"Styling","hidden":true},{"type":"test","section":"Tests","hidden":true},{"type":"build","section":"Build System","hidden":true},{"type":"ci","section":"Continuous Integration","hidden":true}]'

  # Build and publish when a release is created
  build-and-publish:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: devora
            asset_name: devora-x86_64-linux-gnu.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: devora
            asset_name: devora-aarch64-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: devora.exe
            asset_name: devora-x86_64-windows-msvc.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: devora
            asset_name: devora-x86_64-macos.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: devora
            asset_name: devora-aarch64-macos.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install openssl@3

      - name: Build binary
        run: cargo build --target ${{ matrix.target }} --release

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Create archive
        shell: bash
        run: |
          staging="devora-${{ matrix.target }}-${{ needs.release-please.outputs.tag_name }}"
          mkdir -p "$staging"

          # Copy binary and additional files
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "$staging/"
          cp README.md LICENSE "$staging/" 2>/dev/null || true

          # Create archive
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$staging.zip" "$staging"
            echo "asset_path=$staging.zip" >> $GITHUB_ENV
          else
            tar czf "$staging.tar.gz" "$staging"
            echo "asset_path=$staging.tar.gz" >> $GITHUB_ENV
          fi

      - name: Generate checksums
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            certutil -hashfile "${{ env.asset_path }}" SHA256 | grep -E "[0-9A-Fa-f]{64}" > "${{ env.asset_path }}.sha256"
          else
            sha256sum "${{ env.asset_path }}" > "${{ env.asset_path }}.sha256"
          fi

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release-please.outputs.upload_url }}
          asset_path: ${{ env.asset_path }}
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: application/octet-stream

      - name: Upload Checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release-please.outputs.upload_url }}
          asset_path: ${{ env.asset_path }}.sha256
          asset_name: ${{ matrix.asset_name }}.sha256
          asset_content_type: text/plain

  # Publish to crates.io
  publish-crate:
    needs: [release-please, build-and-publish]
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}

  # Update Homebrew formula
  update-homebrew:
    needs: [release-please, build-and-publish]
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        uses: dawidd6/action-homebrew-bump-formula@v3
        with:
          token: ${{ secrets.HOMEBREW_TOKEN }}
          formula: devora
          base-branch: main
          force: true

  # Build and push Docker images
  docker:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKER_USERNAME }}/devora
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.debian
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release-please.outputs.tag_name }}

  # Notify on successful release
  notify:
    needs: [release-please, build-and-publish, publish-crate, update-homebrew, docker]
    if: always() && needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    steps:
      - name: Create release comment
        if: needs.publish-crate.result == 'success' && needs.docker.result == 'success'
        run: |
          echo "✅ Release ${{ needs.release-please.outputs.tag_name }} completed successfully!"
          echo "📦 Published to crates.io"
          echo "🐳 Docker images available"
          echo "🍺 Homebrew formula updated"
          echo "🔗 Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag_name }}"